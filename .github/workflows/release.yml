name: Build Release Package

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false
        default: 'snapshot'

jobs:
  build-debian-package:
    name: Build Debian Package
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for changelog

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debhelper \
          devscripts \
          build-essential \
          cmake \
          qtbase5-dev \
          libqt5charts5-dev \
          libqt5sql5-mysql \
          python3-dev \
          python3-pip \
          lintian

    - name: Install Python dependencies
      run: |
        pip3 install -r python/requirements.txt || echo "No requirements.txt"

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Build Debian package
      run: |
        chmod +x build-deb.sh
        ./build-deb.sh
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}

    - name: Run lintian (Debian package checker)
      run: |
        lintian ../*.deb || true
      continue-on-error: true

    - name: List generated packages
      run: |
        ls -lh ../*.deb
        echo "## Package Information" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        dpkg-deb --info ../*.deb >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{ steps.version.outputs.VERSION }}
        path: ../*.deb
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ../*.deb
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## WeatherStationMonitor ${{ steps.version.outputs.VERSION }}

          ### Installation

          **Debian/Ubuntu:**
          ```bash
          # Download the .deb package
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/weather-station-monitor_${{ steps.version.outputs.VERSION }}_amd64.deb

          # Install
          sudo dpkg -i weather-station-monitor_${{ steps.version.outputs.VERSION }}_amd64.deb

          # Install dependencies if needed
          sudo apt-get install -f
          ```

          **Configuration:**
          ```bash
          # Create configuration
          sudo mkdir -p /etc/weather-station-monitor
          sudo cp /usr/share/weather-station-monitor/config/example_config.json /etc/weather-station-monitor/config.json

          # Edit with your credentials
          sudo nano /etc/weather-station-monitor/config.json
          ```

          **Database Setup:**
          ```bash
          # Setup MySQL database
          mysql -u root -p < /usr/share/weather-station-monitor/database/schema.sql
          ```

          ### Changes
          See full changelog in commit history.

          ### Requirements
          - Ubuntu 22.04 LTS or later
          - MySQL 8.0+
          - OpenWeatherMap API key
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-installation:
    name: Test Package Installation
    runs-on: ubuntu-22.04
    needs: build-debian-package

    steps:
    - name: Download package
      uses: actions/download-artifact@v4
      with:
        pattern: debian-package-*
        merge-multiple: true

    - name: Install MySQL for testing
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-server

    - name: Test package installation
      run: |
        echo "## Installation Test" >> $GITHUB_STEP_SUMMARY

        # Try to install package
        sudo dpkg -i *.deb || true

        # Install missing dependencies
        sudo apt-get install -f -y

        # Verify installation
        if dpkg -l | grep weather-station-monitor; then
          echo "✅ Package installed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Package installation failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        # Check installed files
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Installed Files" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        dpkg -L weather-station-monitor | head -20 >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Test package removal
      run: |
        sudo dpkg -r weather-station-monitor
        if ! dpkg -l | grep weather-station-monitor; then
          echo "✅ Package removed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Package removal issues" >> $GITHUB_STEP_SUMMARY
        fi
