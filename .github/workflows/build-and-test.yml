name: Build and Test

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-test:
    name: Build and Test on Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          qtbase5-dev \
          qtchooser \
          qt5-qmake \
          qtbase5-dev-tools \
          libqt5charts5-dev \
          libqt5sql5-mysql \
          python3-dev \
          python3-pip \
          lcov

    - name: Install Python dependencies
      run: |
        pip3 install -r python/requirements.txt || echo "No requirements.txt or installation issues"

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON ..

    - name: Build project
      run: |
        cd build
        make -j$(nproc)

    - name: List build artifacts
      run: |
        ls -lh build/
        ls -lh build/tests/ || echo "No tests directory"

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose
      continue-on-error: true  # Continue to coverage even if tests fail (for now)

    - name: Generate code coverage
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch || true
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/moc_*' --output-file coverage_filtered.info --ignore-errors unused || true
        lcov --list coverage_filtered.info || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: build/coverage_filtered.info
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/Testing/
        retention-days: 7

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: weather-station-monitor-binary
        path: build/weather-station-monitor
        retention-days: 7

    - name: Build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Binary: weather-station-monitor" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: Available in test-results artifact" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage: Uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
